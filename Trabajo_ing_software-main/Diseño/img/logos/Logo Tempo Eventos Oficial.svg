<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Fondo circular amarillo -->
  <circle cx="250" cy="250" r="245" fill="#F8F005" />
  
  <!-- Aro interior negro -->
  <circle cx="250" cy="250" r="218" fill="none" stroke="#0B0B0B" stroke-width="11" />

  <!-- Texto principal "temp" -->
  <text x="64" y="294" font-family="&#39;Arial Black&#39;, &#39;Helvetica Neue&#39;, Impact, sans-serif" font-weight="900" font-style="italic" font-size="112" letter-spacing="-5" fill="#0B0B0B">temp</text>

  <!-- Letra "o" estilizada como reloj -->
  <g transform="translate(384, 253)">
    <!-- Círculo exterior negro -->
    <circle cx="0" cy="0" r="46" fill="#0B0B0B" />
    <!-- Aro fino amarillo interior -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#F8F005" stroke-width="2.5" />
    <!-- Aguja / manecilla vertical -->
    <polygon points="0,-24 -4.5,6 4.5,6" fill="#F8F005" />
  </g>

  <!-- Subtítulo "eventos" -->
  <text x="128" y="330" font-family="&#39;Helvetica Neue&#39;, Arial, sans-serif" font-weight="700" font-style="italic" font-size="33" letter-spacing="-0.5" fill="#0B0B0B">eventos</text>

  <!-- Línea horizontal derecha bajo la "p" y la "o" -->
  <line x1="292" y1="322" x2="386" y2="322" stroke="#0B0B0B" stroke-width="3.5" stroke-linecap="round" />
</svg>