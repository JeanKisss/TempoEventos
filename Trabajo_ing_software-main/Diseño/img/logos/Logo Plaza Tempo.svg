<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow-green" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.16" />
    </filter>
    <radialGradient id="grad-green" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#72f205" />
      <stop offset="85%" stop-color="#6aed01" />
      <stop offset="100%" stop-color="#60db00" />
    </radialGradient>
  </defs>

  <!-- Círculo base -->
  <circle cx="256" cy="256" r="244" fill="url(#grad-green)" filter="url(#shadow-green)" />

  <!-- Anillo interior negro -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="#0b0f0a" stroke-width="8" />

  <!-- Tipografía principal "plaza" -->
  <g transform="translate(334, 286) skewX(-12)">
    <text x="0" y="0" font-family="&#39;Liberation Sans&#39;, &#39;Nimbus Sans&#39;, Arial, Helvetica, sans-serif" font-weight="900" font-size="112" letter-spacing="-5.5" text-anchor="end" fill="#0b0f0a" stroke="#6aed01" stroke-width="2">plaza</text>
  </g>

  <!-- Ícono tacómetro / reloj ("o") -->
  <g transform="translate(384, 260)">
    <!-- Aro exterior negro -->
    <circle cx="0" cy="0" r="39" fill="none" stroke="#0b0f0a" stroke-width="6.5" />
    <!-- Disco interior negro -->
    <circle cx="0" cy="0" r="27" fill="#0b0f0a" />
    <!-- Aguja verde recortada -->
    <line x1="-2" y1="2" x2="17" y2="-11" stroke="#6aed01" stroke-width="5.5" stroke-linecap="round" />
    <circle cx="-2" cy="2" r="5" fill="#6aed01" />
  </g>

  <!-- Línea horizontal izquierda y subtítulo "tempo" -->
  <line x1="126" y1="312" x2="232" y2="312" stroke="#0b0f0a" stroke-width="2.8" />
  <g transform="translate(238, 320) skewX(-13)">
    <text x="0" y="0" font-family="&#39;Liberation Sans&#39;, &#39;Nimbus Sans&#39;, Arial, Helvetica, sans-serif" font-weight="600" font-size="25" letter-spacing="-0.2" fill="#0b0f0a">tempo</text>
  </g>
</svg>